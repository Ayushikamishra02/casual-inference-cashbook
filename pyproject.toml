[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causalbook"
version = "1.0.0"
description = "Causal inference casebook: difference-in-differences, propensity scores and synthetic control on four classic policy questions, with placebo and robustness tests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayushika Mishra" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyreadr>=0.5",
    "causaldata>=0.1.4",
]

[project.optional-dependencies]
dowhy = ["dowhy>=0.12"]
dev = ["pytest>=8", "ruff>=0.5", "pysyncon>=1.4", "dowhy>=0.12"]

[project.scripts]
casebook = "causalbook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
markers = ["slow: takes more than ~20 seconds"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E731", "B905", "B023"]
